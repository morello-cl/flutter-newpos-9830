group = "cl.mufin.newpos_9830"
version = "1.0-SNAPSHOT"

buildscript {
    ext.kotlin_version = "2.2.20"
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath("com.android.tools.build:gradle:8.11.1")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version")
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
        // SDK propietario del terminal desde GitHub Packages (repo PRIVADO).
        // Solo se agrega si hay token; quien no lo tenga usa el jar local.
        def newposSdkToken = project.findProperty("gpr.token") ?: System.getenv("GITHUB_TOKEN")
        if (newposSdkToken?.trim()) {
            maven {
                name = "NewposSdkGitHubPackages"
                url = uri("https://maven.pkg.github.com/" +
                        (project.findProperty("newposSdkRepo") ?: "morello-cl/newpos-sdk"))
                credentials {
                    username = project.findProperty("gpr.user") ?: System.getenv("GITHUB_ACTOR") ?: "token"
                    password = newposSdkToken
                }
            }
        }
    }
}

apply plugin: "com.android.library"
apply plugin: "kotlin-android"

android {
    namespace = "cl.mufin.newpos_9830"

    compileSdk = 36

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17
    }

    sourceSets {
        main.java.srcDirs += "src/main/kotlin"
        test.java.srcDirs += "src/test/kotlin"
    }

    defaultConfig {
        minSdk = 24
    }

    dependencies {
        // SDK de firmware Newpos (com.pos.device.*), solo en tiempo de compilación
        // (el terminal lo provee en runtime vía <uses-library com.pos.device>).
        // Se resuelve en este orden — el jar NUNCA se versiona ni se publica en
        // el paquete (ver android/libs/README.md):
        //  1) jar local: libs/ (dev por `path:`) o <app>/android/newpos-sdk/.
        //  2) si no hay jar local: GitHub Packages (repo privado), requiere token.
        def newposLocalJars = fileTree(dir: "libs", include: ["*.jar"]) +
                fileTree(dir: "${rootProject.projectDir}/newpos-sdk", include: ["*.jar"])
        if (!newposLocalJars.isEmpty()) {
            compileOnly newposLocalJars
        } else {
            compileOnly "cl.mufin:newpos-sdk:${project.findProperty('newposSdkVersion') ?: '1.0.0'}"
        }
        testImplementation("org.jetbrains.kotlin:kotlin-test")
        testImplementation("org.mockito:mockito-core:5.0.0")
    }

    testOptions {
        unitTests.all {
            useJUnitPlatform()

            testLogging {
               events "passed", "skipped", "failed", "standardOut", "standardError"
               outputs.upToDateWhen {false}
               showStandardStreams = true
            }
        }
    }
}
