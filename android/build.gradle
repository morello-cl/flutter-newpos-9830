group = "cl.mufin.newpos_9830"
version = "1.0-SNAPSHOT"

buildscript {
    ext.kotlin_version = "2.2.20"
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath("com.android.tools.build:gradle:8.11.1")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version")
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: "com.android.library"
apply plugin: "kotlin-android"

android {
    namespace = "cl.mufin.newpos_9830"

    compileSdk = 36

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17
    }

    sourceSets {
        main.java.srcDirs += "src/main/kotlin"
        test.java.srcDirs += "src/test/kotlin"
    }

    defaultConfig {
        minSdk = 24
    }

    dependencies {
        // SDK de firmware Newpos (com.pos.device.*), solo en tiempo de compilación
        // (el terminal lo provee en runtime vía <uses-library com.pos.device>).
        // El jar lo entrega Newpos y NO se versiona ni se publica (ver
        // android/libs/README.md). Se toma de dos ubicaciones locales:
        //  1) libs/ del plugin — al consumir por `path:` (dev local).
        //  2) <app>/android/newpos-sdk/ — al consumir por git: cada app pone el suyo.
        compileOnly fileTree(dir: "libs", include: ["*.jar"])
        compileOnly fileTree(dir: "${rootProject.projectDir}/newpos-sdk", include: ["*.jar"])
        testImplementation("org.jetbrains.kotlin:kotlin-test")
        testImplementation("org.mockito:mockito-core:5.0.0")
    }

    testOptions {
        unitTests.all {
            useJUnitPlatform()

            testLogging {
               events "passed", "skipped", "failed", "standardOut", "standardError"
               outputs.upToDateWhen {false}
               showStandardStreams = true
            }
        }
    }
}
